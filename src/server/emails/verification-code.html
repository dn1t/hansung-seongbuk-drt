<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>DRT 인증 코드</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg {
          background-color: #111110 !important;
        }
        .t12 {
          color: #eeeeec !important;
        }
        .t11 {
          color: #b5b3ad !important;
        }
        .t10 {
          color: #7c7b74 !important;
        }
        .code {
          background-color: #191918 !important;
          border-color: #2a2a28 !important;
          color: #eeeeec !important;
        }
        .line {
          border-color: #222221 !important;
        }
      }
    </style>
  </head>
  <body class="bg" style="margin: 0; padding: 0; background-color: #fdfdfc">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">DRT 인증 코드는 {{code}} 입니다.</div>

    <table
      role="presentation"
      class="bg"
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #fdfdfc"
    >
      <tr>
        <td align="center" style="padding: 32px 20px">
          <!--[if mso]><table role="presentation" width="480" border="0" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              font-family:
                Pretendard, -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;,
                &quot;Malgun Gothic&quot;, Helvetica, Arial, sans-serif;
            "
          >
            <tr>
              <td style="padding: 0 4px">
                <p class="t11" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: bold; color: #63635e">
                  DRT
                </p>
                <p
                  class="t12"
                  style="
                    margin: 28px 0 8px;
                    font-size: 28px;
                    line-height: 36px;
                    font-weight: bold;
                    letter-spacing: -0.5px;
                    color: #21201c;
                  "
                >
                  인증 코드를 알려 드려요
                </p>
                <p
                  class="t11"
                  style="margin: 0 0 24px; font-size: 16px; line-height: 24px; font-weight: 500; color: #63635e"
                >
                  가입 화면에 아래 6자리 코드를 입력해 주세요.
                </p>

                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      class="code t12"
                      align="center"
                      style="
                        padding: 18px 12px;
                        background-color: #f9f9f8;
                        border: 1px solid #e9e8e6;
                        border-radius: 12px;
                        font-size: 32px;
                        line-height: 40px;
                        font-weight: 600;
                        letter-spacing: 10px;
                        font-variant-numeric: tabular-nums;
                        color: #21201c;
                      "
                    >
                      {{code}}
                    </td>
                  </tr>
                </table>

                <p
                  class="t11"
                  style="margin: 16px 0 0; font-size: 15px; line-height: 22px; font-weight: 500; color: #63635e"
                >
                  코드는 10분 동안 유효해요. 요청하지 않았다면 이 메일은 무시해도 돼요.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 4px 0">
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      class="line t10"
                      style="
                        padding-top: 16px;
                        border-top: 1px solid #f1f0ef;
                        font-size: 13px;
                        line-height: 20px;
                        color: #82827c;
                      "
                    >
                      성북구 대학생 전용 심야 귀가 버스
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
