<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>DRT 사전 신청이 열렸어요</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg {
          background-color: #111110 !important;
        }
        .t12 {
          color: #eeeeec !important;
        }
        .t11 {
          color: #b5b3ad !important;
        }
        .t10 {
          color: #7c7b74 !important;
        }
        .link {
          color: #ffca16 !important;
        }
        .line {
          border-color: #222221 !important;
        }
      }
    </style>
  </head>
  <body class="bg" style="margin: 0; padding: 0; background-color: #fdfdfc">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      {{nights}} 운행해요. 지금 사전 신청할 수 있어요.
    </div>

    <table
      role="presentation"
      class="bg"
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #fdfdfc"
    >
      <tr>
        <td align="center" style="padding: 32px 20px">
          <!--[if mso]><table role="presentation" width="480" border="0" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              font-family:
                Pretendard, -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;,
                &quot;Malgun Gothic&quot;, Helvetica, Arial, sans-serif;
            "
          >
            <tr>
              <td style="padding: 0 4px">
                <p class="t11" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: bold; color: #63635e">
                  DRT
                </p>
                <p
                  class="t12"
                  style="
                    margin: 28px 0 8px;
                    font-size: 28px;
                    line-height: 36px;
                    font-weight: bold;
                    letter-spacing: -0.5px;
                    color: #21201c;
                  "
                >
                  사전 신청이 열렸어요
                </p>
                <p
                  class="t11"
                  style="margin: 0 0 24px; font-size: 16px; line-height: 24px; font-weight: 500; color: #63635e"
                >
                  {{nights}} 운행해요. 타고 싶은 날과 시간을 미리 신청하면, 신청한 학생들의 집 방향으로 노선이
                  만들어져요.
                </p>

                <!-- 앱의 기본 버튼(amber-9, rounded-xl, font-bold)과 같은 모양 -->
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" bgcolor="#ffc53d" style="background-color: #ffc53d; border-radius: 12px">
                      <a
                        href="{{url}}"
                        target="_blank"
                        style="
                          display: block;
                          padding: 14px 28px;
                          font-size: 16px;
                          line-height: 24px;
                          font-weight: bold;
                          color: #21201c;
                          text-decoration: none;
                        "
                      >
                        사전 신청하기
                      </a>
                    </td>
                  </tr>
                </table>

                <p
                  class="t11"
                  style="margin: 16px 0 0; font-size: 15px; line-height: 22px; font-weight: 500; color: #63635e"
                >
                  가입할 때 쓴 학교 이메일로 보내 드리는 안내예요.
                </p>
                <p
                  class="t11"
                  style="margin: 16px 0 0; font-size: 13px; line-height: 20px; color: #63635e; word-break: break-all"
                >
                  버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여 넣어 주세요.<br />
                  <a href="{{url}}" target="_blank" class="link" style="color: #ab6400; text-decoration: underline"
                    >{{url}}</a
                  >
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 4px 0">
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      class="line t10"
                      style="
                        padding-top: 16px;
                        border-top: 1px solid #f1f0ef;
                        font-size: 13px;
                        line-height: 20px;
                        color: #82827c;
                      "
                    >
                      성북구 대학생 전용 심야 귀가 버스
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
